name: Lint

on:
  pull_request:

permissions:
  contents: read
  repository-projects: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.11
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1.47.2
      - name: Format Proto
        run: make proto-fmt
      - name: Lint Proto
        run: make proto-lint
